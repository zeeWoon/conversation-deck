<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shuffle Up</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column. Home is a short form (name, join code, host a deck).
   Play shows the lobby code and roster on top, then your own category chips, your card, and a sticky action bar. */
:root{
  --bg:#E3EAE5;
  --bg-2:#D5DFD8;
  --ink:#14211C;
  --ink-2:#4B5C54;
  --line:#B7C6BC;
  --paper:#FCFDFB;
  --paper-ink:#16221D;
  --deck:#F2B134;
  --on-deck:#2A1D00;
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1814;
    --bg-2:#17231E;
    --ink:#E8F0EB;
    --ink-2:#9DB0A5;
    --line:#2D3C35;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1814;
  --bg-2:#17231E;
  --ink:#E8F0EB;
  --ink-2:#9DB0A5;
  --line:#2D3C35;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.app{max-width:480px;min-height:100%;margin:0 auto;padding-inline:16px;padding-block:22px 0;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column}

.lab,.lab-i{display:block;font:500 12px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:0}

/* ---------- home ---------- */
.brand{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.stackmark{flex:none}
.sm1{fill:var(--deck);opacity:.4}
.sm2{fill:var(--deck);opacity:.7}
.sm3{fill:var(--deck)}
.brand h1{margin:0;font:800 36px/1 var(--f-display);letter-spacing:-.03em}
.brand p{margin:6px 0 0;color:var(--ink-2);font-size:15px;line-height:1.35}

.step{margin-bottom:26px}
.step>.lab{margin-bottom:10px}
.step-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.step-h .lab{margin:0}
.hint{margin:10px 0 0;color:var(--ink-2);font-size:14px}

.field{width:100%;min-width:0;min-height:52px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:transparent;font:500 17px var(--f-body)}
.field:focus{outline:2px solid var(--ink);outline-offset:1px}
.join-row{display:flex;gap:10px}
.join-row .btn{flex:none;min-width:96px}
.code-in{flex:1;font:500 24px var(--f-mono);letter-spacing:.28em;text-transform:uppercase;text-align:center;padding-left:calc(14px + .28em)}

.decks{display:flex;flex-direction:column;gap:8px}
.deck-opt{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer}
.deck-opt:has(input:checked){border-color:var(--ink);background:var(--bg-2)}
.deck-opt:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
.mini{width:34px;aspect-ratio:5/7;border-radius:6px;background-color:var(--d);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 1px,transparent 1px 6px),repeating-linear-gradient(-45deg,rgba(255,255,255,.22) 0 1px,transparent 1px 6px);
  box-shadow:inset 0 0 0 3px var(--d),inset 0 0 0 4px rgba(255,255,255,.65)}
.d-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.d-txt b{font:700 18px/1.2 var(--f-display)}
.d-txt small{color:var(--ink-2);font-size:14px;line-height:1.35}
.d-n{font:500 12px var(--f-mono);color:var(--ink-2)}
.deck-opt:has(input:checked) .d-n{color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 15px;border:1.5px solid var(--line);border-radius:99px;font:500 15px var(--f-body)}
.chip i{font:400 11px var(--f-mono);font-style:normal;color:var(--ink-2)}
.chip input:checked+span{background:var(--deck);color:var(--on-deck);border-color:transparent}
.chip input:checked+span i{color:inherit;opacity:.75}
.chip input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- shared bar + buttons ---------- */
.bar{position:sticky;bottom:0;margin-top:auto;display:flex;gap:10px;padding:16px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 26%)}
.bar.col{flex-direction:column}
.bar-info{display:flex;flex-direction:column;gap:3px;font:500 12px/1.3 var(--f-mono);letter-spacing:.04em;color:var(--ink-2)}
.btn{flex:1;min-width:0;min-height:54px;padding:0 14px;border:1.5px solid transparent;border-radius:14px;font:600 17px var(--f-display);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.primary{background:var(--deck);color:var(--on-deck)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
@media (hover:hover){.btn.primary:not(:disabled):hover,.btn.dark:not(:disabled):hover{filter:brightness(1.08)}.btn.ghost:not(:disabled):hover{border-color:var(--ink)}}

/* ---------- play ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.link{border:0;background:none;padding:0;min-height:44px;font:500 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink);cursor:pointer}
.lobby{display:flex;flex-direction:column;gap:10px;margin:2px 0 4px;padding:12px 0;border-block:1px solid var(--line)}
.lobby-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.code{padding:4px 12px;border:1.5px dashed var(--ink-2);border-radius:10px;background:transparent;font:500 22px/1.2 var(--f-mono);letter-spacing:.22em;color:var(--ink);cursor:pointer}
.note{margin:8px 0 0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;color:var(--ink-2)}
.pips{display:flex;flex-wrap:wrap;gap:6px}
.pip{max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:5px 10px;border:1px solid var(--line);border-radius:99px;font:500 12px var(--f-mono);color:var(--ink-2)}
.pip.draw{border-style:dashed}
.pip.now{border-color:var(--ink);color:var(--ink)}
.pip.done{background:var(--deck);color:var(--on-deck);border-color:transparent}

.turn{margin:12px 0 0}
.turn h2{margin:0 0 4px;font:700 28px/1.1 var(--f-display);letter-spacing:-.02em}
.turn p.sub{margin:0 0 12px;color:var(--ink-2);font-size:15px;min-height:1.45em}
.chip-lab{margin:0 0 8px}

.stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding-block:20px}
.stage{position:relative;width:max(190px,min(62vw,250px,calc((100dvh - 520px) * .714)));aspect-ratio:5/7}
.stage.idle{cursor:pointer}
.layer,.slot,.face{position:absolute;inset:0;border-radius:18px}
.layer{transform:var(--t0)}
.l1{--t0:translate(-4px,9px) rotate(-2.5deg)}
.l2{--t0:translate(5px,6px) rotate(2deg)}
.l3{--t0:translate(-2px,3px) rotate(-.8deg)}
.slot{perspective:1100px;transition:transform .2s ease}
@media (hover:hover){.stage.idle:hover .slot{transform:translateY(-5px)}}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.3,.7,.2,1)}
.flip.revealed{transform:rotateY(180deg)}
.face{-webkit-backface-visibility:hidden;backface-visibility:hidden}

.back{background-color:var(--deck);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.2) 0 1px,transparent 1px 12px),repeating-linear-gradient(-45deg,rgba(255,255,255,.2) 0 1px,transparent 1px 12px);
  box-shadow:inset 0 0 0 9px var(--deck),inset 0 0 0 10.5px rgba(255,255,255,.6),0 1px 0 rgba(0,0,0,.08),0 12px 24px -10px rgba(0,0,0,.45)}
.face.back::after{content:"?";position:absolute;inset:0;margin:auto;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--deck);color:var(--on-deck);border:1.5px solid rgba(255,255,255,.7);font:700 34px/1 var(--f-display)}

.front{transform:rotateY(180deg);background:var(--paper);color:var(--paper-ink);padding:20px 20px 18px;display:flex;flex-direction:column;box-shadow:inset 0 0 0 7px var(--paper),inset 0 0 0 8.5px var(--deck),0 1px 0 rgba(0,0,0,.08),0 14px 26px -10px rgba(0,0,0,.5)}
.f-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-inline:4px}
.f-cat{font:500 11px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:#4B5C54}
.f-q{margin:auto 0;padding-inline:4px;font:600 clamp(19px,5.6vw,23px)/1.22 var(--f-display);letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.f-q.m{font-size:clamp(17px,5vw,20px)}
.f-q.s{font-size:clamp(15px,4.4vw,17px)}
.f-bot{display:flex;align-items:center;justify-content:space-between;min-height:26px;padding-inline:4px}
.f-no{font:500 11px var(--f-mono);letter-spacing:.08em;color:#4B5C54}
.stamp{padding:4px 10px;border-radius:6px;background:var(--deck);color:var(--on-deck);font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;opacity:0;transform:rotate(-6deg) scale(1.7);transition:opacity .25s ease .15s,transform .3s cubic-bezier(.3,1.4,.5,1) .15s}
.flip.locked .stamp{opacity:1;transform:rotate(-6deg) scale(1)}

@keyframes riffL{0%,100%{transform:var(--t0,none)}22%{transform:translate(-24%,-3%) rotate(-8deg)}48%{transform:translate(-4%,1%) rotate(-1deg)}74%{transform:translate(-20%,-2%) rotate(-6deg)}}
@keyframes riffR{0%,100%{transform:var(--t0,none)}22%{transform:translate(24%,-3%) rotate(8deg)}48%{transform:translate(4%,1%) rotate(1deg)}74%{transform:translate(20%,-2%) rotate(6deg)}}
.stage.shuffling .l1{animation:riffL .95s cubic-bezier(.4,0,.2,1) both}
.stage.shuffling .l2{animation:riffR .95s cubic-bezier(.4,0,.2,1) .05s both}
.stage.shuffling .l3{animation:riffL .95s cubic-bezier(.4,0,.2,1) .1s both}
.stage.shuffling .slot{animation:riffR .95s cubic-bezier(.4,0,.2,1) .15s both}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(92vw,420px);padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--bg);font:500 14px/1.3 var(--f-body);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s ease}
#toast.show{opacity:1}

@media (prefers-reduced-motion: reduce){
  .flip,.slot,.stamp{transition:none}
  .stage.shuffling .layer,.stage.shuffling .slot{animation:none}
}
.pip.away{opacity:.45}
.lobby-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lobby-row p{margin:0;min-width:0}
.invite{flex:none;min-height:32px;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
.retry{display:block;width:100%;padding:14px;border:1.5px dashed var(--line);border-radius:14px;background:transparent;text-align:left;font:400 15px/1.4 var(--f-body);color:var(--ink-2);cursor:pointer}
.resume{margin:0 0 18px}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div id="app" class="app">

  <section id="home" class="screen">
    <header class="brand">
      <svg class="stackmark" viewBox="0 0 44 44" width="44" height="44" aria-hidden="true">
        <rect class="sm1" x="7" y="6" width="22" height="31" rx="4" transform="rotate(-14 18 21)"/>
        <rect class="sm2" x="10" y="5" width="22" height="31" rx="4" transform="rotate(-2 21 20)"/>
        <rect class="sm3" x="14" y="7" width="22" height="31" rx="4" transform="rotate(10 25 22)"/>
      </svg>
      <div>
        <h1>Shuffle Up</h1>
        <p>Conversation cards for your small group. Everyone draws on their own phone, and a card someone locks in leaves the deck.</p>
      </div>
    </header>

    <p id="resume" class="note resume" hidden>Reconnecting to your lobby…</p>

    <div class="step">
      <label class="lab" for="nameIn">Your name</label>
      <input id="nameIn" class="field" type="text" maxlength="20" autocomplete="given-name" placeholder="What should the group call you?">
    </div>

    <div class="step">
      <h2 class="lab">Join a lobby</h2>
      <div class="join-row">
        <input id="codeIn" class="field code-in" type="text" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="CODE" aria-label="Lobby code">
        <button id="joinBtn" class="btn dark" type="button">Join</button>
      </div>
      <p class="hint">Ask the host for the 4-character code on their screen.</p>
    </div>

    <div class="step">
      <div class="step-h">
        <h2 class="lab">Or host a new lobby</h2>
      </div>
      <div id="decks" class="decks" role="radiogroup" aria-label="Deck"></div>
    </div>

    <div class="bar col">
      <div class="bar-info"><span id="homeInfo"></span></div>
      <button id="createBtn" class="btn primary" type="button" disabled>Start a lobby</button>
    </div>
  </section>

  <section id="play" class="screen" hidden>
    <div class="topbar">
      <button id="leave" class="link" type="button">← Leave</button>
      <span id="tDeck" class="lab-i"></span>
      <span id="tLeft" class="lab-i"></span>
    </div>

    <div class="lobby">
      <div class="lobby-top">
        <span class="lab-i">Lobby code</span>
        <button id="codeBtn" class="code" type="button" aria-label="Copy lobby code"></button>
      </div>
      <div class="lobby-row">
        <p id="rCount" class="lab-i"></p>
        <button id="linkBtn" class="link invite" type="button" hidden>Invite link</button>
      </div>
      <div id="pips" class="pips"></div>
    </div>
    <p id="soloNote" class="note" hidden></p>

    <div class="turn">
      <h2>Your card</h2>
      <p id="tSub" class="sub" aria-live="polite"></p>
      <p class="lab-i chip-lab">Category</p>
      <div id="chips" class="chips"></div>
    </div>

    <div class="stage-wrap">
      <div id="stage" class="stage">
        <div class="layer back l1"></div>
        <div class="layer back l2"></div>
        <div class="layer back l3"></div>
        <div class="slot">
          <div id="flip" class="flip">
            <div class="face back"></div>
            <div class="face front">
              <div class="f-top"><span id="cCat" class="f-cat"></span></div>
              <p id="cQ" class="f-q"></p>
              <div class="f-bot"><span id="cNo" class="f-no"></span><span class="stamp">Locked</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="bar" class="bar"></div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>window.SU_INIT = <?!= init ?>;</script>
<script>
(function(){
'use strict';

var INIT={url:'',code:''};
try{ var w=window.SU_INIT||{}; INIT.url=String(w.url||''); INIT.code=String(w.code||''); }catch(e){}

function $(s){return document.querySelector(s);}
var app=$('#app'), flip=$('#flip'), stage=$('#stage');
var RM=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function wait(ms){return new Promise(function(r){setTimeout(r,RM?0:ms);});}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function tidy(s){ return String(s).replace(/\s+/g,' ').trim(); }

/* Browsers may block storage inside the Apps Script frame, so everything has an in-memory fallback. */
var mem={};
var store={
  get:function(k){ try{ var v=localStorage.getItem(k); if(v!==null) return v; }catch(e){} return mem[k]===undefined?null:mem[k]; },
  set:function(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} },
  del:function(k){ delete mem[k]; try{ localStorage.removeItem(k); }catch(e){} }
};
var TOK='shuffleup.token', NAME='shuffleup.name', LOB='shuffleup.lobby';
function makeToken(){
  var a='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', b=new Uint8Array(20), s='';
  try{ crypto.getRandomValues(b); }catch(e){ for(var j=0;j<20;j++) b[j]=Math.floor(Math.random()*256); }
  for(var i=0;i<20;i++) s+=a.charAt(b[i]%a.length);
  return s;
}

var S={
  decks:[], pick:null, name:'', token:'', code:'',
  view:null,               /* last view the server sent for this lobby */
  fake:null,               /* phase to show while a lock or next request is in flight */
  cats:new Set(),          /* categories I picked (empty = all) */
  catSig:'', shown:'',
  busy:false, offline:false, polling:false
};
S.token=store.get(TOK)||makeToken(); store.set(TOK,S.token);

var tt;
function toast(m){
  var t=$('#toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(tt); tt=setTimeout(function(){t.classList.remove('show');},3400);
}
function theme(color,on){ app.style.setProperty('--deck',color); app.style.setProperty('--on-deck',on); }
var cur='home';
function show(name){
  cur=name;
  ['home','play'].forEach(function(id){ $('#'+id).hidden=(id!==name); });
  try{window.scrollTo(0,0);}catch(e){}
  if(name==='home' && S.pick) theme(S.pick.color,S.pick.on);
}

/* ---------- talking to the script ---------- */
function call(a,payload){
  return new Promise(function(resolve){
    var done=false, req=Object.assign({a:a},payload||{});
    var t=setTimeout(function(){ if(!done){ done=true; resolve({ok:false,err:'timeout'}); } },30000);
    function fin(r){ if(done) return; done=true; clearTimeout(t); resolve(r); }
    try{
      if(typeof google==='undefined'||!google.script||!google.script.run){ fin({ok:false,err:'nobackend'}); return; }
      google.script.run
        .withSuccessHandler(function(s){ var r; try{ r=JSON.parse(s); }catch(e){ r={ok:false,err:'bad'}; } fin(r); })
        .withFailureHandler(function(e){ fin({ok:false,err:'net',msg:String(e&&e.message||e)}); })
        .api(JSON.stringify(req));
    }catch(e){ fin({ok:false,err:'net'}); }
  });
}
var FRIENDLY={
  nolobby:'No lobby with that code. Check it with the host.',
  full:'This lobby is full.',
  nodeck:'That deck is not available any more.',
  busy:'The lobby was busy. Try again.',
  net:'Couldn’t reach the lobby. Check your connection and try again.',
  timeout:'Couldn’t reach the lobby. Check your connection and try again.',
  server:'Something went wrong on the server. Try again.',
  nobackend:'This page only works from the Shuffle Up web app link.',
  bad:'Something was missing. Check your name and the code.'
};
function say(r){ toast(FRIENDLY[r.err]||'Something went wrong. Try again.'); }

/* ---------- home ---------- */
function nameOk(){
  var v=tidy($('#nameIn').value).slice(0,20);
  if(!v){ toast('Enter your name first.'); $('#nameIn').focus(); return null; }
  S.name=v; store.set(NAME,v);
  return v;
}
function homeInfo(){
  $('#homeInfo').textContent=S.pick?(S.pick.name+' · '+S.pick.count+' cards'):'';
}
function buildDecks(){
  var box=$('#decks'); box.innerHTML='';
  S.decks.forEach(function(d){
    var l=document.createElement('label');
    l.className='deck-opt'; l.style.setProperty('--d',d.color);
    l.innerHTML='<input class="vh" type="radio" name="deck" id="deck-'+esc(d.id)+'" value="'+esc(d.id)+'">'+
      '<span class="mini"></span>'+
      '<span class="d-txt"><b>'+esc(d.name)+'</b><small>'+esc(d.blurb)+'</small></span>'+
      '<span class="d-n">'+d.count+'</span>';
    box.appendChild(l);
  });
  var r=S.pick&&document.getElementById('deck-'+S.pick.id); if(r) r.checked=true;
  homeInfo();
}
$('#decks').addEventListener('change',function(e){
  var d=S.decks.filter(function(x){return x.id===e.target.value;})[0];
  if(d){ S.pick=d; theme(d.color,d.on); homeInfo(); }
});
async function loadDecks(){
  var box=$('#decks');
  box.innerHTML='<p class="hint" style="margin:0">Loading the decks…</p>';
  $('#createBtn').disabled=true;
  var r=await call('decks');
  if(!r.ok||!r.decks||!r.decks.length){
    box.innerHTML='';
    var b=document.createElement('button'); b.type='button'; b.className='retry';
    b.textContent=(r.err==='nobackend'?FRIENDLY.nobackend:'Couldn’t load the decks.')+' Tap to try again.';
    b.addEventListener('click',loadDecks); box.appendChild(b);
    return false;
  }
  S.decks=r.decks;
  var keep=S.pick&&S.decks.filter(function(d){return d.id===S.pick.id;})[0];
  S.pick=keep||S.decks.filter(function(d){return d.id==='justmet';})[0]||S.decks[0];
  buildDecks(); theme(S.pick.color,S.pick.on);
  $('#createBtn').disabled=false;
  return true;
}
$('#createBtn').addEventListener('click',async function(){
  if(!nameOk()||!S.pick) return;
  var btn=$('#createBtn'); btn.disabled=true; btn.textContent='Starting…';
  var r=await call('create',{name:S.name,token:S.token,deck:S.pick.id});
  btn.disabled=false; btn.textContent='Start a lobby';
  if(!r.ok){ say(r); return; }
  enterLobby(r);
});
function normCode(v){ return String(v).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4); }
$('#joinBtn').addEventListener('click',joinFromInput);
$('#codeIn').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); joinFromInput(); } });
$('#codeIn').addEventListener('input',function(e){ e.target.value=normCode(e.target.value); });
async function joinFromInput(){
  if(!nameOk()) return;
  var code=normCode($('#codeIn').value);
  if(code.length!==4){ toast('Enter the 4-character lobby code.'); return; }
  var btn=$('#joinBtn'); btn.disabled=true;
  var r=await call('join',{code:code,name:S.name,token:S.token});
  btn.disabled=false;
  if(!r.ok){ say(r); return; }
  enterLobby(r);
}

/* ---------- lobby ---------- */
function phase(){ return S.fake||(S.view?S.view.me.phase:'idle'); }
function faceDown(){ flip.classList.remove('revealed','locked'); S.shown=''; }

function enterLobby(v){
  S.code=v.code; S.view=null; S.fake=null; S.cats.clear(); S.catSig=''; S.busy=false; S.offline=false;
  store.set(LOB,v.code);
  faceDown();
  show('play');
  apply(v,true);
  schedulePoll(3000);
}
function endLobby(msg){
  clearTimeout(pollT); S.code=''; S.view=null; S.fake=null; S.busy=false;
  store.del(LOB); faceDown(); stage.classList.remove('shuffling');
  show('home'); if(msg) toast(msg);
}

function apply(v,force){
  if(!v||!v.me) return;
  if(!force&&S.view&&v.code===S.view.code&&v.v<S.view.v) return;   /* an older answer arriving late */
  S.view=v;
  theme(v.deck.color,v.deck.on);
  buildChips();
  renderPlay();
  if(!S.busy) syncCard();
}

/* The card face always follows what the server says I hold. */
function syncCard(){
  var v=S.view; if(!v) return;
  var p=phase(), c=v.me.card;
  if(p==='idle'||!c){ faceDown(); return; }
  if(S.shown!==c.q){
    $('#cCat').textContent=c.cat;
    $('#cQ').textContent=c.q;
    $('#cQ').className='f-q'+(c.q.length>110?' s':c.q.length>80?' m':'');
    $('#cNo').textContent='No. '+String(c.n).padStart(2,'0');
    S.shown=c.q;
  }
  flip.classList.add('revealed');
  flip.classList.toggle('locked',p==='locked');
}

function selectedCats(){
  var names=S.view?S.view.cats.map(function(c){return c.name;}):[];
  var sel=[]; S.cats.forEach(function(c){ if(names.indexOf(c)>=0) sel.push(c); });
  return sel;
}
function chip(id,label,cat){
  var l=document.createElement('label'); l.className='chip';
  l.innerHTML='<input class="vh" type="checkbox" id="'+id+'"><span>'+esc(label)+' <i></i></span>';
  l.querySelector('input').dataset.cat=cat;
  return l;
}
function buildChips(){
  var v=S.view; if(!v) return;
  var sig=v.cats.map(function(c){return c.name;}).join('|');
  if(sig===S.catSig){ updateChips(); return; }
  S.catSig=sig;
  var names=v.cats.map(function(c){return c.name;});
  Array.from(S.cats).forEach(function(c){ if(names.indexOf(c)<0) S.cats.delete(c); });
  var box=$('#chips'); box.innerHTML='';
  box.appendChild(chip('cat-all','All',''));
  v.cats.forEach(function(c,i){ box.appendChild(chip('cat-'+i,c.name,c.name)); });
  updateChips();
}
function updateChips(){
  var v=S.view; if(!v) return;
  var all=0; v.cats.forEach(function(c){ all+=c.left; });
  $('#chips').querySelectorAll('input').forEach(function(i){
    var cat=i.dataset.cat, n=all;
    if(cat!==''){ var c=v.cats.filter(function(x){return x.name===cat;})[0]; n=c?c.left:0; }
    i.parentNode.querySelector('i').textContent=n;
    i.checked = cat==='' ? S.cats.size===0 : S.cats.has(cat);
  });
}
$('#chips').addEventListener('change',function(e){
  var i=e.target; if(!i||i.tagName!=='INPUT') return;
  var c=i.dataset.cat;
  if(c===''){ S.cats.clear(); }
  else{
    if(i.checked) S.cats.add(c); else S.cats.delete(c);
    if(S.view&&S.cats.size===S.view.cats.length) S.cats.clear();
  }
  updateChips();
});

function renderRoster(){
  var list=S.view.roster.map(function(x){
    return x.me?{me:true,n:x.n,st:phase()==='locked'?'lock':(phase()==='drawn'?'draw':'pick'),away:false}:x;
  });
  var locked=list.filter(function(x){return x.st==='lock';}).length;
  $('#rCount').textContent=list.length+(list.length===1?' player':' players')+' · '+locked+' locked in';
  $('#pips').innerHTML=list.map(function(x){
    return '<span class="pip'+(x.st==='lock'?' done':'')+(x.st==='draw'?' draw':'')+(x.me?' now':'')+(x.away?' away':'')+'">'+(x.st==='lock'?'✓ ':'')+esc(x.n)+(x.me?' (you)':'')+'</span>';
  }).join('');
}
function renderBar(){
  var bar=$('#bar'); bar.innerHTML='';
  var p=phase(), v=S.view;
  function add(txt,cls,fn){
    var b=document.createElement('button'); b.type='button'; b.className='btn '+cls;
    b.textContent=txt; b.disabled=S.busy; b.addEventListener('click',fn); bar.appendChild(b);
  }
  if(p==='idle') add('Shuffle and draw','primary',draw);
  else if(p==='drawn'){
    if(v.me.changes>0) add('Change · '+v.me.changes+' left','ghost',draw);
    add('Lock in','primary',lock);
  }else add('Draw another card','primary',next);
}
function renderPlay(){
  var v=S.view; if(!v) return;
  $('#tDeck').textContent=v.deck.name;
  $('#tLeft').textContent=v.left+' left';
  $('#codeBtn').textContent=v.code;
  $('#linkBtn').hidden=!INIT.url;
  var note=$('#soloNote');
  if(S.offline){ note.hidden=false; note.textContent='Reconnecting to the lobby…'; } else note.hidden=true;
  var p=phase(), ch=v.me.changes, sub;
  if(p==='idle') sub='Pick a category, then shuffle. Only you will see your card.';
  else if(p==='drawn') sub=ch>0?('Only you can see this card. '+ch+(ch===1?' change':' changes')+' left.'):'No changes left. Lock this one in.';
  else sub='Locked in. Nobody else in the lobby can draw this card.';
  $('#tSub').textContent=sub;
  stage.classList.toggle('idle',p==='idle'&&!S.busy);
  renderRoster(); renderBar();
}

/* ---------- actions ---------- */
async function draw(){
  var v=S.view;
  if(S.busy||!v||phase()==='locked') return;
  var changing=phase()==='drawn', sel=selectedCats(), avail=0;
  v.cats.forEach(function(c){ if(!sel.length||sel.indexOf(c.name)>=0) avail+=c.left; });
  if(changing){
    var held=v.me.card;
    if(held&&(!sel.length||sel.indexOf(held.cat)>=0)) avail--;
    if(avail<=0){ toast('No other cards are available in this selection. Lock this one in or try another category.'); return; }
  }else if(avail<=0){ toast('No cards left in that selection. Try another category.'); return; }

  S.busy=true; renderPlay();
  var req=call('draw',{code:S.code,token:S.token,cats:sel});
  if(flip.classList.contains('revealed')){ flip.classList.remove('revealed','locked'); await wait(480); }
  stage.classList.add('shuffling');
  var r=(await Promise.all([req,wait(1000)]))[0];
  stage.classList.remove('shuffling');
  if(!S.code){ S.busy=false; return; }
  if(r.ok){
    S.offline=false; S.shown='';
    apply(r,true);
    syncCard();                         /* flips the new card up */
    await wait(650);
  }else{
    if(r.me) apply(r,true);
    if(r.err==='none') toast('No cards left in that selection. Try another category.');
    else if(r.err==='noother') toast('No other cards are available in this selection. Lock this one in or try another category.');
    else if(r.err==='nochanges') toast('No changes left. Lock this one in.');
    else if(r.err==='nolobby'){ endLobby('This lobby has ended or expired.'); return; }
    else if(r.err==='notjoined'){ await rejoin(); }
    else say(r);
  }
  S.busy=false; renderPlay(); syncCard();
}
async function lock(){
  if(S.busy||!S.view) return;
  S.busy=true; S.fake='locked'; flip.classList.add('locked'); renderPlay();
  var r=await call('lock',{code:S.code,token:S.token});
  S.fake=null; S.busy=false;
  if(!S.code) return;
  if(r.ok){ S.offline=false; apply(r,true); }
  else{
    if(r.me) apply(r,true);
    if(r.err==='taken') toast('Someone locked that card a moment before you. Draw a new one.');
    else if(r.err==='nolobby'){ endLobby('This lobby has ended or expired.'); return; }
    else if(r.err==='notjoined'){ await rejoin(); }
    else{ say(r); pollSoon(); }
  }
  renderPlay(); syncCard();
}
async function next(){
  if(S.busy||!S.view) return;
  S.busy=true; S.fake='idle'; faceDown(); renderPlay();
  var r=await call('next',{code:S.code,token:S.token});
  S.fake=null; S.busy=false;
  if(!S.code) return;
  if(r.ok){ S.offline=false; apply(r,true); }
  else{
    if(r.err==='nolobby'){ endLobby('This lobby has ended or expired.'); return; }
    if(r.err==='notjoined'){ await rejoin(); } else { say(r); pollSoon(); }
  }
  renderPlay(); syncCard();
}

/* ---------- keeping in step with the lobby ---------- */
var pollT=0;
function schedulePoll(ms){ clearTimeout(pollT); pollT=setTimeout(poll,ms); }
function pollSoon(){ if(S.code) schedulePoll(400); }
async function rejoin(){
  var r=await call('join',{code:S.code,name:S.name||store.get(NAME)||'Guest',token:S.token});
  if(r.ok){ apply(r,true); return true; }
  if(r.err==='nolobby'||r.err==='full'){ endLobby(r.err==='full'?'This lobby is full.':'This lobby has ended or expired.'); }
  return false;
}
async function poll(){
  if(!S.code||S.polling) return;
  S.polling=true;
  var r=await call('state',{code:S.code,token:S.token});
  S.polling=false;
  if(!S.code) return;
  if(r.ok){ if(S.offline){ S.offline=false; } apply(r); renderPlay(); }
  else if(r.err==='nolobby'){ endLobby('This lobby has ended or expired. Start or join another.'); return; }
  else if(r.err==='notjoined'){ await rejoin(); if(!S.code) return; }
  else{ S.offline=true; renderPlay(); }
  schedulePoll(S.offline?6000:(document.hidden?10000:3000));
}
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&S.code&&cur==='play') schedulePoll(100); });

var armed=false, armT;
$('#leave').addEventListener('click',function(){
  var b=$('#leave');
  if(phase()==='drawn'&&!armed){
    armed=true; b.textContent='Tap again to leave';
    clearTimeout(armT); armT=setTimeout(function(){ armed=false; b.textContent='← Leave'; },3000);
    return;
  }
  armed=false; clearTimeout(armT); b.textContent='← Leave';
  var code=S.code;
  if(code) call('leave',{code:code,token:S.token});
  endLobby('');
});
function copy(text,ok,fail){
  try{ navigator.clipboard.writeText(text).then(function(){ toast(ok); },function(){ toast(fail); }); }
  catch(e){ toast(fail); }
}
$('#codeBtn').addEventListener('click',function(){
  copy(S.code,'Code copied. Share it with your group.','Tell your group the code: '+S.code);
});
$('#linkBtn').addEventListener('click',function(){
  var link=INIT.url+(INIT.url.indexOf('?')>=0?'&':'?')+'lobby='+S.code;
  copy(link,'Invite link copied.','Copy this link: '+link);
});
stage.addEventListener('click',function(){ if(phase()==='idle'&&!S.busy) draw(); });

/* ---------- start ---------- */
async function start(){
  $('#nameIn').value=store.get(NAME)||'';
  if(INIT.code) $('#codeIn').value=normCode(INIT.code);
  var saved=store.get(LOB);
  var deckP=loadDecks();
  if(saved){
    $('#resume').hidden=false;
    var r=await call('state',{code:saved,token:S.token});
    if(!r.ok&&r.err==='notjoined'&&store.get(NAME)){ r=await call('join',{code:saved,name:store.get(NAME),token:S.token}); }
    $('#resume').hidden=true;
    if(r.ok){ enterLobby(r); return; }
    if(r.err==='nolobby'||r.err==='notjoined'||r.err==='full') store.del(LOB);
  }
  await deckP;
}
start();
})();
</script>
